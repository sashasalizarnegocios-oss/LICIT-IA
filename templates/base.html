<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LICITia{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="{{ url_for('buscar', origen=origen) }}">LICITia</a>
    <nav aria-label="Navegación principal">
      <a href="{{ url_for('buscar', origen='demo') }}"{% if origen == 'demo' %} aria-current="page"{% endif %}>Demostración</a>
      <a href="{{ url_for('buscar', origen='oece') }}"{% if origen == 'oece' %} aria-current="page"{% endif %}>Datos importados</a>
      <a href="{{ url_for('equipo') }}">Equipo</a>
    </nav>
  </div>
</header>
<main class="wrap">{% block content %}{% endblock %}</main>
<footer class="wrap">
  <a href="{{ seace }}">Convocatorias en curso · SEACE</a>
  <a href="{{ oece }}">Datos de contratación abierta · OECE</a>
</footer>
</body>
</html>
